name: hypecheck

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://hypecheck:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/hypecheck
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /data
    UPTIME_URL: ${UPTIME_URL:-http://api:8000/healthz}
    MODEL_MODE: ${MODEL_MODE:-mock}
    MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    BACKBOARD_API_KEY: ${BACKBOARD_API_KEY:-}
    BACKBOARD_MODEL: ${BACKBOARD_MODEL:-gpt-4o-mini}
    BACKBOARD_LLM_PROVIDER: ${BACKBOARD_LLM_PROVIDER:-openai}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
    ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
    ELASTIC_INDEX: ${ELASTIC_INDEX:-hypecheck-passages-v2}
    ELASTIC_INFERENCE_ID: ${ELASTIC_INFERENCE_ID:-.elser-2-elastic}
    ELASTIC_SEMANTIC: ${ELASTIC_SEMANTIC:-true}
    MEDLINEPLUS_ENABLED: ${MEDLINEPLUS_ENABLED:-true}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    SENTRY_ENABLE_LOGS: ${SENTRY_ENABLE_LOGS:-true}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    SENTRY_PROFILE_SESSION_SAMPLE_RATE: ${SENTRY_PROFILE_SESSION_SAMPLE_RATE:-0.2}
    RELEASE: ${RELEASE:-hypecheck-local}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ENABLE_FAILURE_INJECTION: ${ENABLE_FAILURE_INJECTION:-false}
    MAX_ACTIVE_CASES: ${MAX_ACTIVE_CASES:-10}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-6}
    CASE_TIMEOUT_SECONDS: ${CASE_TIMEOUT_SECONDS:-120}
    RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-35}
    VIDEO_ENABLED: ${VIDEO_ENABLED:-true}
    VIDEO_ENCODER_PRESET: ${VIDEO_ENCODER_PRESET:-veryfast}
    VIDEO_ENCODER_THREADS: ${VIDEO_ENCODER_THREADS:-2}
    TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}
    TTS_VOICE: ${TTS_VOICE:-coral}
    WHISPER_MODEL: ${WHISPER_MODEL:-/opt/whisper/ggml-base.en.bin}
    GPTZERO_API_KEY: ${GPTZERO_API_KEY:-}
    GPTZERO_FILLER_READING: ${GPTZERO_FILLER_READING:-false}
  volumes:
    - media:/data
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hypecheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hypecheck
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hypecheck"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [python, -m, app.cli, init-db]
    restart: "no"
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      retries: 5
  worker:
    <<: *backend
    command: [celery, -A, app.queue.celery, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    depends_on:
      migrate:
        condition: service_completed_successfully
  beat:
    <<: *backend
    command: [celery, -A, app.queue.celery, beat, --loglevel=INFO, --schedule=/data/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-development}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-1.0}
        VITE_SENTRY_PROFILE_SESSION_SAMPLE_RATE: ${VITE_SENTRY_PROFILE_SESSION_SAMPLE_RATE:-0.1}
        VITE_SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE: ${VITE_SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE:-1.0}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  redis:
  media:
  caddy_data:
  caddy_config:
